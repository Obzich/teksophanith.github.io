  <text x="180" y="235" font-family="Inter, sans-serif" font-size="72" font-weight="800" fill="#0f172a">Move With Joy</text>
  <text x="180" y="315" font-family="Inter, sans-serif" font-size="20" fill="#475569" letter-spacing="0.01em" xml:space="preserve">Welcome to our website, where we are on a mission to provide exceptional moving services to customers in the US. As a startup, we believe that moving doesn't have to be stressful or complicated, and we are passionate about making the process as seamless and enjoyable as possible.</text>
  <rect x="180" y="360" width="180" height="52" rx="20" fill="url(#button-grad)"/>
