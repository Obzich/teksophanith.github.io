  <rect x="730" y="114" width="320" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="744" y="139" font-family="Inter, sans-serif" font-size="15" fill="#475569">Postcode</text>
  <rect x="1065" y="116" width="100" height="36" rx="18" fill="#10b981"/>
